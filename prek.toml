#:schema https://www.schemastore.org/prek.json

[[repos]]
repo  = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "check-added-large-files" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id             = "mise-format"
name           = "mise format"
entry          = "mise run format"
language       = "system"
pass_filenames = false
