[tools]
biome = "latest"
prek  = "latest"
tombi = "latest"
typos = "latest"

[tasks]
"lint:ruff"  = "uvx ruff check --fix"
"lint:ty"    = "uvx ty check --fix"
"lint:typos" = "typos"

[tasks.format]
run = [
  "uvx ruff format",
  "tombi format",
  "biome format --write",
]

[tasks.lint]
depends = ["lint:*"]

[tasks.check]
run = [{ task = "format" }, { task = "lint" }]
