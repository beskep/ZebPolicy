[tools]
oxfmt    = "latest"
prek     = "latest"
tombi    = "latest"
typos    = "latest"
typstyle = "latest"

[tasks]
[tasks.format]
run = [
  "uvx ruff format",
  "tombi format",
  "oxfmt",
  "typstyle --inplace --line-width 120 --wrap-text=sentence .",
]

[tasks.lint]
run = [
  "uvx ruff check --fix --exit-zero",
  "uvx ty check --fix --exit-zero",
  "typos",
]

[tasks.check]
run = [
  { task = "format" },
  { task = "lint" },
]
