[tools]
biome = "latest"
prek  = "latest"
tombi = "latest"
typos = "latest"

[tasks]
[tasks.format]
run = [
  "uvx ruff format",
  "tombi format",
  "biome format --write",
]

[tasks.lint]
run = [
  "uvx ruff check --fix",
  "uvx ty check --fix",
  "typos",
]

[tasks.check]
run = [
  { task = "format" },
  { task = "lint" },
]
